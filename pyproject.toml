[project]
name = "aether-search"
version = "0.2.0"
description = "Dual-channel search MCP: Grok primary + LLM-orchestrated multi-backend auxiliary retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pydantic>=2.1.0",
    "pydantic-settings>=2.1.0",
    "tenacity>=8.2.0",
]

[project.scripts]
aether-search = "aether_search.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_search"]
